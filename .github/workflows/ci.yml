name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/ ml/

      # models/production/model.pkl is gitignored (regenerated, not
      # committed - see ml/TODO_model_registry.md), so CI runs the full
      # pipeline from raw data every time. This doubles as a continuous
      # check that the "one command reproduces everything" claim in
      # data/README.md actually still holds.
      - name: Run ML pipeline (data -> model registry)
        run: |
          python ml/preprocess.py
          python ml/baseline.py
          python ml/experiments_xgboost.py
          python ml/experiments_fingerprint_models.py
          python ml/select_winner.py
          python ml/register_model.py

      - name: Test (pytest + coverage)
        run: pytest backend/tests/ ml/tests/ --cov=backend/app --cov=ml --cov-report=term-missing

      - name: Audit dependencies (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt || true

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

      - name: Build frontend Docker image
        run: docker build -t frontend:ci .
